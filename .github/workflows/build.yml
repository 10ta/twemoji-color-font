name: Build
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'twemoji version to build (e.g. 17.0.3). Empty = latest upstream tag'
        required: false
        default: ''
  schedule:
    # Daily at 03:17 UTC: build & release automatically when upstream tags a new version.
    - cron: '17 3 * * *'

permissions:
  contents: write

# Never run two builds of the same ref at once (e.g. schedule overlapping a manual run).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap job: decide which twemoji version to build and whether building is needed at all.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    steps:
      - name: Resolve version and decide
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          latest_upstream() {
            git ls-remote --tags --refs --sort=-v:refname \
                https://github.com/jdecked/twemoji.git 'v*' \
              | sed -n 's|.*refs/tags/v\([0-9]\+\.[0-9]\+\.[0-9]\+\)$|\1|p' | head -n1
          }

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"            # manual run with explicit version
          elif [ "$REF_TYPE" = "tag" ]; then
            VERSION="${REF_NAME#v}"                 # pushed tag v17.0.3 -> build 17.0.3
          else
            VERSION=$(latest_upstream)
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine twemoji version"
            exit 1
          fi

          SHOULD_BUILD=true
          if [ "$EVENT" = "schedule" ]; then
            # Already released this version? Then there is nothing to do.
            if git ls-remote --exit-code --tags "$REPO_URL" "refs/tags/v$VERSION" >/dev/null; then
              echo "v$VERSION already released, skipping."
              SHOULD_BUILD=false
            else
              echo "New upstream version v$VERSION found."
            fi
          fi

          echo "Version: $VERSION, build: $SHOULD_BUILD"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

  build-packages:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            inkscape potrace imagemagick \
            python3-fontforge python3-fonttools python3-yaml \
            npm git make debhelper devscripts build-essential
          sudo npm install -g svgo
          git clone https://github.com/13rac1/scfbuild.git SCFBuild
      - name: Sync SVG assets from upstream
        run: make -s update
      - name: Build
        run: make -s fast
      - name: Collect metadata for PR
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          MERGE_ID=$(git rev-parse --short HEAD)
          PRNUMBER=${GITHUB_REF_NAME%/merge}
          echo "ARTIFACT_NAME=PR-$PRNUMBER-$MERGE_ID" >> $GITHUB_ENV
      - name: Collect metadata for Push
        if: ${{ github.event_name == 'push' }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "ARTIFACT_NAME=$BRANCH-$COMMIT" >> $GITHUB_ENV
      - name: Collect metadata for schedule
        if: ${{ github.event_name == 'schedule' }}
        run: echo "ARTIFACT_NAME=twemoji-$VERSION" >> $GITHUB_ENV
      - name: Collect metadata for workflow_dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "ARTIFACT_NAME=$BRANCH-$COMMIT" >> $GITHUB_ENV
      - name: Store packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.ARTIFACT_NAME}}
          path: |
            build/*.deb
            build/*-Linux-*.tar.gz
            build/*.zip
          compression-level: 0
      - name: Store regular package
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.ARTIFACT_NAME}}-regular
          path: |
            build/*.zip
            !build/*-MacOS-*.zip
            !build/*-Win-*.zip
          compression-level: 0
      - name: Store Linux package
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.ARTIFACT_NAME}}-linux
          path: build/*-Linux-*.tar.gz
          compression-level: 0
      - name: Store Deb package
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.ARTIFACT_NAME}}-deb
          path: build/*.deb
          compression-level: 0
      - name: Store MacOS package
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.ARTIFACT_NAME}}-macos
          path: build/*-MacOS-*.zip
          compression-level: 0
      - name: Store Windows package
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.ARTIFACT_NAME}}-windows
          path: build/*-Win-*.zip
          compression-level: 0

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.deb
            build/*-Linux-*.tar.gz
            build/*.zip
          generate_release_notes: true

      - name: Create Release (manual trigger)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.ARTIFACT_NAME }}
          files: |
            build/*.deb
            build/*-Linux-*.tar.gz
            build/*.zip
          generate_release_notes: true

      - name: Create Release (scheduled, new upstream version)
        if: ${{ github.event_name == 'schedule' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Twemoji ${{ env.VERSION }}
          body: |
            Automated build of [jdecked/twemoji v${{ env.VERSION }}](https://github.com/jdecked/twemoji/releases/tag/v${{ env.VERSION }}).
          files: |
            build/*.deb
            build/*-Linux-*.tar.gz
            build/*.zip