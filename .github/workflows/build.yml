name: Build
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            inkscape potrace imagemagick \
            python3-fontforge python3-fonttools python3-yaml \
            npm git make debhelper devscripts build-essential
          sudo npm install -g svgo
          git clone https://github.com/13rac1/scfbuild.git SCFBuild
      - name: Build
        run: make -s fast
      - name: Collect metadata for PR
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          MERGE_ID=$(git rev-parse --short HEAD)
          PRNUMBER=${GITHUB_REF_NAME%/merge}
          echo "ARTIFACT_NAME=PR-$PRNUMBER-$MERGE_ID" >> $GITHUB_ENV
      - name: Collect metadata for Push
        if: ${{ github.event_name == 'push' }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "ARTIFACT_NAME=$BRANCH-$COMMIT" >> $GITHUB_ENV
      - name: Collect metadata for workflow_dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "ARTIFACT_NAME=$BRANCH-$COMMIT" >> $GITHUB_ENV
      - name: Store packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.ARTIFACT_NAME}}
          path: |
            build/*.deb
            build/*-Linux-*.tar.gz
            build/*.zip
          compression-level: 0
      - name: Store regular package
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.ARTIFACT_NAME}}-regular
          path: |
            build/*.zip
            !build/*-MacOS-*.zip
            !build/*-Win-*.zip
          compression-level: 0
      - name: Store Linux package
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.ARTIFACT_NAME}}-linux
          path: build/*-Linux-*.tar.gz
          compression-level: 0
      - name: Store Deb package
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.ARTIFACT_NAME}}-deb
          path: build/*.deb
          compression-level: 0
      - name: Store MacOS package
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.ARTIFACT_NAME}}-macos
          path: build/*-MacOS-*.zip
          compression-level: 0
      - name: Store Windows package
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.ARTIFACT_NAME}}-windows
          path: build/*-Win-*.zip
          compression-level: 0

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.deb
            build/*-Linux-*.tar.gz
            build/*.zip
          generate_release_notes: true

      - name: Create Release (manual trigger)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.ARTIFACT_NAME }}
          files: |
            build/*.deb
            build/*-Linux-*.tar.gz
            build/*.zip
          generate_release_notes: true
          
